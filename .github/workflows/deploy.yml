# Deploy the static site to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check data file and links
        run: node tools/check-site.mjs
      - id: pages
        uses: actions/configure-pages@v5
      - name: Prepare site folder
        # Publish everything except repo-only files (tools, incoming sources, docs).
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'tools' \
            --exclude 'incoming' --exclude 'README.md' --exclude 'package.json' ./ _site/
      - name: Adjust paths if served from a sub-folder
        # e.g. https://<user>.github.io/<repo>/ — base_path is empty once a custom domain is set.
        run: node tools/apply-base-path.mjs _site "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
